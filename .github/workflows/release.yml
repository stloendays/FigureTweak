name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3 pillow
      - run: pwsh -File build.ps1 -Python python
      - name: smoke test
        shell: pwsh
        run: |
          $p = Start-Process .\dist\FigureTweak.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: FigureTweak
          path: dist/FigureTweak.exe
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE) { gh release create ${{ github.ref_name }} --title "FigureTweak ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md }
          gh release upload ${{ github.ref_name }} dist/FigureTweak.exe --clobber
        shell: pwsh
